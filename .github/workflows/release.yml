name: Release

# Tag vX.Y.Z (on a commit reachable from main) → check, package, attach the .vsix to a GitHub release, then publish
# to VS Marketplace + Open VSX. The GitHub release goes first, so that a registry failure never leaves a version
# without its download. Re-running after a partial failure is safe: a version already on a registry is skipped.
# Required repository secrets: VSCE_PAT (Azure DevOps PAT, Marketplace › Manage), OVSX_PAT (open-vsx.org token).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag is on main and matches package.json
        run: |
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not on main"; exit 1; }
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
      - run: npm run check
      - run: npm run build
      - name: Browser bench (panel, agent and proxy in headless Chrome)
        env:
          AUD_CHROME: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Integration tests inside VS Code
        run: xvfb-run -a npm run test:integration
      - run: npx vsce package --no-dependencies -o "viewkeeper-${GITHUB_REF_NAME}.vsix"
      - name: Refuse a package that carries test instruments
        run: |
          unzip -l "viewkeeper-${GITHUB_REF_NAME}.vsix" | tee /tmp/vsix.txt
          if grep -qiE "test/|sonda|\.ts$|\.map$" /tmp/vsix.txt; then echo "the package contains test files"; exit 1; fi
      - name: GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: viewkeeper-${{ github.ref_name }}.vsix
          generate_release_notes: true
      - name: Publish to Visual Studio Marketplace (skips if this version is already there)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # `vsce show` prints "undefined" (not JSON) when the extension is not published yet: treat anything unparsable as "not there".
          if npx vsce show argalla.viewkeeper --json 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{let j={};try{j=JSON.parse(d)||{}}catch{}process.exit((j.versions||[]).some(v=>v.version==='$VER')?0:1)})"; then
            echo "Marketplace already has $VER — skipping"
          else
            # The Marketplace (Azure DevOps) answers TF10216 "services are currently unavailable" now and then.
            attempt=1; max=4
            while :; do
              out="$(npx vsce publish --no-dependencies --packagePath "viewkeeper-${GITHUB_REF_NAME}.vsix" 2>&1)"; code=$?
              echo "$out"
              if [ $code -eq 0 ] || echo "$out" | grep -qiE "already exists|already published"; then break; fi
              if [ $attempt -ge $max ]; then echo "vsce publish failed after $max attempts"; exit $code; fi
              wait_s=$((attempt*20)); echo "Transient failure; retry $attempt/$max in ${wait_s}s"; sleep $wait_s
              attempt=$((attempt+1))
            done
          fi
      - name: Publish to Open VSX (skips if this version is already there)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if npx ovsx get argalla.viewkeeper -v "$VER" --metadata >/dev/null 2>&1; then
            echo "Open VSX already has $VER — skipping"
          else
            attempt=1; max=4
            while :; do
              out="$(npx ovsx publish "viewkeeper-${GITHUB_REF_NAME}.vsix" 2>&1)"; code=$?
              echo "$out"
              if [ $code -eq 0 ] || echo "$out" | grep -qiE "already published|already exists"; then break; fi
              if [ $attempt -ge $max ]; then echo "ovsx publish failed after $max attempts"; exit $code; fi
              wait_s=$((attempt*20)); echo "Transient failure; retry $attempt/$max in ${wait_s}s"; sleep $wait_s
              attempt=$((attempt+1))
            done
          fi
